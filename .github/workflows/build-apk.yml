name: Build Sổ Nợ APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Write Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          elif [ -f app/google-services.json ]; then
            echo "Using checked-in google-services.json"
          else
            echo "Missing GOOGLE_SERVICES_JSON_BASE64 secret and app/google-services.json"; exit 1
          fi
          python3 - <<'PY2'
          import json
          from pathlib import Path
          p=Path('app/google-services.json')
          data=json.loads(p.read_text())
          pkg=data.get('client',[{}])[0].get('client_info',{}).get('android_client_info',{}).get('package_name')
          if pkg != 'com.sono.app':
              raise SystemExit(f'google-services.json package mismatch: {pkg}')
          print('Firebase config OK for', pkg)
          PY2

      - name: Write Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL secret"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Missing SUPABASE_PUBLISHABLE_KEY secret"; exit 1; }
          python3 - <<'PY'
          import os
          from pathlib import Path
          def js(s):
              return s.replace('\\','\\\\').replace('"','\\"').replace('\n','\\n')
          p = Path('app/src/main/assets/www/config.js')
          p.write_text(
              '// Generated by GitHub Actions. Do not commit real credentials.\n'
              f'window.SUPABASE_URL = "{js(os.environ["SUPABASE_URL"])}";\n'
              f'window.SUPABASE_PUBLISHABLE_KEY = "{js(os.environ["SUPABASE_PUBLISHABLE_KEY"])}";\n'
              f'window.VAPID_PUBLIC_KEY = "{js(os.environ.get("VAPID_PUBLIC_KEY", ""))}";\n',
              encoding='utf-8'
          )
          PY

      - name: Build signed release APK or signed debug APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > release-keystore.jks
            export RELEASE_STORE_FILE="$GITHUB_WORKSPACE/release-keystore.jks"
            export RELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD"
            export RELEASE_KEY_ALIAS="$KEY_ALIAS"
            export RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
            gradle --no-daemon :app:assembleRelease
            echo "APK_TYPE=release" >> "$GITHUB_ENV"
          else
            echo "Signing secrets not configured; building a signed debug APK for direct installation."
            gradle --no-daemon :app:assembleDebug
            echo "APK_TYPE=debug" >> "$GITHUB_ENV"
          fi

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          if [ "$APK_TYPE" = "release" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/so-no-release.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/so-no-debug.apk
          fi
          ls -lh dist/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: so-no-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload mapping/provenance info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: so-no-build-info
          path: |
            app/build/outputs/**
          if-no-files-found: ignore
